<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Face Attendance</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Authentication Modal -->
<div id="auth-modal">
  <div class="auth-box">
    <div class="auth-header">
      <div class="logo-badge">📸</div>
      <h2 id="auth-title">College Log in</h2>
      <p class="auth-sub">AI-Powered Facial Attendance</p>
    </div>

    <input id="auth-name" type="text" placeholder="Full name" autocomplete="off">
    <input id="auth-email" type="email" placeholder="College email" autocomplete="off">
    <input id="auth-pwd" type="password" placeholder="Password (min 6 chars)">
    <input id="auth-pin" type="password" placeholder="Recovery PIN (optional, min 4 chars)" autocomplete="off">
    <div id="auth-msg" class="status"></div>
    
    <button id="auth-submit">Log in</button>
    <button id="auth-forgot" class="ghost">Forgot password?</button>

    <div id="forgot-panel" class="hidden">
      <label>Registered email</label>
      <input id="rst-email" type="email" placeholder="College email" autocomplete="off">
      <div id="rst-code-row">
        <button id="rst-send" class="ghost">Send code</button>
        <input id="rst-code" type="text" placeholder="6-digit code" inputmode="numeric" autocomplete="off">
      </div>
      <div id="rst-pin-row" style="display: none;">
        <input id="rst-pin" type="password" placeholder="Recovery PIN" autocomplete="off">
      </div>
      <input id="rst-pwd" type="password" placeholder="New password (min 6 chars)">
      <button id="rst-submit">Set new password</button>
      <button id="rst-toggle" class="ghost">Use recovery PIN instead</button>
      <button id="rst-cancel" class="ghost">Back to login</button>
    </div>

    <button id="auth-toggle" class="ghost">Need an account? Sign up</button>
    <button id="auth-settings" class="ghost">App settings (URL / token)</button>
  </div>
</div>

<!-- Main Application -->
<div id="app" class="hidden">

  <header>
    <div class="brand">
      <div class="brand-icon">📸</div>
      <h1>Face Attendance</h1>
    </div>
    <div>
      <div class="user-badge">
        <span class="avatar-dot"></span>
        <span id="user-label" class="user-label"></span>
      </div>
      <button id="logout-btn" class="ghost" title="Log out">Logout</button>
      <button id="settings-btn" title="Settings">&#9881;</button>
    </div>
  </header>

  <!-- Segmented Navigation Tabs -->
  <nav>
    <button id="tab-students" class="tab active"><span>👨‍🎓</span> Students</button>
    <button id="tab-staff" class="tab"><span>💼</span> Teacher / Staff</button>
    <button id="tab-report" class="tab"><span>📊</span> Attendance</button>
  </nav>

  <!-- Camera Biometric Viewfinder -->
  <div class="view-wrap">
    <div class="cam-badge"><span class="cam-dot"></span> AI Camera Active</div>
    <div class="scan-corner top-left"></div>
    <div class="scan-corner top-right"></div>
    <div class="scan-corner bottom-left"></div>
    <div class="scan-corner bottom-right"></div>
    <video id="cam" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <div id="app-status" class="status">Starting camera&#8230;</div>

  <!-- Panel: Students -->
  <section id="panel-students" class="panel active">
    <div class="card">
      <div class="card-header">
        <span class="card-icon">➕</span>
        <h2>Register a Student</h2>
      </div>
      <input id="stu-name" type="text" placeholder="Student name" autocomplete="off">
      <input id="stu-reg" type="text" placeholder="Registration number" autocomplete="off">
      <input id="stu-class" type="text" placeholder="Class / Section (e.g. 10-A)" autocomplete="off">
      <button id="enroll-student">Register student</button>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-icon">⚡</span>
        <h2>Scan Students</h2>
      </div>
      <button id="scan-student">Start student scan</button>
      <div id="scan-log"></div>
    </div>
  </section>

  <!-- Panel: Staff -->
  <section id="panel-staff" class="panel">
    <div class="card">
      <div class="card-header">
        <span class="card-icon">➕</span>
        <h2>Register Teacher / Staff</h2>
      </div>
      <select id="stf-role">
        <option value="teacher">Teacher</option>
        <option value="staff">Staff</option>
      </select>
      <input id="staff-name" type="text" placeholder="Name" autocomplete="off">
      <input id="staff-reg" type="text" placeholder="Registration number (employee ID)" autocomplete="off">
      <button id="enroll-staff">Register</button>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-icon">⚡</span>
        <h2>Scan Teacher / Staff</h2>
      </div>
      <button id="scan-staff">Start scan</button>
      <div id="staff-log"></div>
    </div>
  </section>

  <!-- Panel: Report -->
  <section id="panel-report" class="panel">
    <div class="card">
      <div class="card-header" style="justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="card-icon">📋</span>
          <h2>Attendance</h2>
        </div>
        <button id="refresh-btn" style="width: auto; padding: 6px 14px; font-size: 0.82rem; margin: 0;">Refresh</button>
      </div>
      <div id="report-list"></div>
    </div>
  </section>

</div>

<!-- Admin Password Verification Modal -->
<div id="admin-modal" class="modal hidden">
  <div class="modal-box">
    <h2>🔒 Admin Verification</h2>
    <label>Enter Admin Password to access Settings:</label>
    <input id="admin-pwd-input" type="password" placeholder="Password" autocomplete="off">
    <div id="admin-pwd-msg" class="status err" style="display: none;"></div>
    <div class="modal-actions">
      <button id="admin-pwd-submit">Unlock</button>
      <button id="admin-pwd-cancel" class="ghost">Cancel</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div id="settings-modal" class="modal hidden">
  <div class="modal-box">
    <h2>Settings</h2>
    <label>Apps Script Web App URL</label>
    <input id="cfg-url" type="text" placeholder="https://script.google.com/macros/s/.../exec">
    <label>Secret token (optional)</label>
    <input id="cfg-token" type="text" placeholder="same token set in Apps Script">
    <div class="modal-actions">
      <button id="cfg-save">Save</button>
      <button id="cfg-cancel">Cancel</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script src="app.js"></script>
</body>
</html>
